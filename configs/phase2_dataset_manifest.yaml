  bed_files_downloaded_and_md5_verified: true
  gata1_optimal_invalid_summits_excluded: 3
  gata1_conservative_invalid_summits_excluded: 3
  coordinate_filtered_optimal_windows: 14313
  coordinate_filtered_optimal_windows_with_ATAC_overlap: 11773
