change_log:
  - date: "2026-08-22"
    change: "Require ATAC overlap for primary positive samples so accessibility-signal matching is defined for both classes."
    timing: "Before matching, chromosome splitting, model training, or inspection of model outputs."
    rationale: "The frozen negative design matches on ATAC signal; positives without an overlapping ATAC peak have no comparable peak signal."
  - date: "2026-08-22"
    change: "Accept Ensembl REST windows after reference-equivalence audit instead of waiting for the complete ENCODE gzip transfer."
    timing: "Before model training or inspection of model outputs."
    rationale: "The two assemblies use identical chr1-chr22 component accession versions and lengths, and 22/22 coordinate-level RefSeq spot checks matched."
