positive_definition:
  center: narrowPeak_summit
  window_bp: 256
  primary_task_requires_K562_ATAC_overlap: true
  atac_signal_assignment: maximum_signal_of_overlapping_ENCFF333TAT_peaks
  remove_if:
    - invalid_narrowPeak_summit
    - contains_N
    - overlaps_blacklist
    - outside_primary_chromosomes
    - window_out_of_bounds
    - overlaps_another_retained_positive

negative_definition:
  source: K562_ATAC_accessible_regions
  exclude:
    - overlaps_GATA1_peak
    - within_128bp_of_GATA1_peak_boundary
    - overlaps_blacklist
    - contains_N
    - window_out_of_bounds
  match_on:
    - chromosome
    - GC_fraction_bin_0.02
    - accessibility_signal_quantile
    - window_length
  ratio_to_positive: 1.0
  random_genomic_negative_role: sensitivity_analysis_only

leakage_controls:
  split_unit: chromosome
  canonical_key: min(sequence, reverse_complement(sequence))
  reject_cross_split_exact_or_rc_duplicates: true
  reject_cross_split_interval_overlap: true
  reject_same_peak_across_splits: true
  audit_low_complexity_and_near_duplicates: true

download_gate:
  require_all_status_released: true
  require_md5_match: true
  require_assembly_match: GRCh38
  require_nonempty_files: true
  require_expected_peak_count_check: true
  require_audit_snapshot: true

